# vim:fileencoding=utf-8:foldmethod=marker

#: General stuff {{{
shell /usr/bin/zsh
#: }}}

#: Font stuff {{{
font_family Lilex
bold_font Lilex Demi Bold
italic_font Lilex Italic
bold_italic_font Lilex Demi Bold Italic
font_size 12.0

# ref: https://erwin.co/kitty-and-nerd-fonts/
# ref: https://github.com/ryanoasis/nerd-fonts/wiki/Glyph-Sets-and-Code-Points#glyph-sets
# Nerd Fonts - Seti-UI + Custom
symbol_map U+e5fa-U+e631 Lilex Nerd Font Mono
# Nerd Fonts - Devicons
symbol_map U+e700-U+e7c5 Lilex Nerd Font Mono
# Nerd Fonts - Font awesome
symbol_map U+f000-U+f2e0 Lilex Nerd Font Mono
# Nerd Fonts - Font awesome extension
symbol_map U+e200-U+e2a9 Lilex Nerd Font Mono
# Nerd Fonts - Material Design Icons
symbol_map U+f500-U+fd46 Lilex Nerd Font Mono
# Nerd Fonts - Weather Icons
symbol_map U+e300-U+e3eb Lilex Nerd Font Mono
# Nerd Fonts - Octicons
symbol_map U+f400-U+f4a9,U+2665,U+26A1 Lilex Nerd Font Mono
# Nerd Fonts - Powerline
symbol_map U+e0a0-U+e0a2,U+e0b0-U+e0b3 Lilex Nerd Font Mono
# Nerd Fonts - Powerline Extra
symbol_map U+e0a3,U+e0b4-U+e0c8,U+e0ca,U+e0cc-U+e0d4 Lilex Nerd Font Mono
# Nerd Fonts - IEC Power Hack
symbol_map U+23fb-U+23fe,U+2b58 Lilex Nerd Font Mono
# Nerd Fonts - Font Logos (Formerly Font Linux)
symbol_map U+F300-U+F32d Lilex Nerd Font Mono
# Nerd Fonts - Pomicons
symbol_map U+E000-U+E00A Lilex Nerd Font Mono
# Nerd Fonts - Codicons
symbol_map U+ea60-U+ebeb Lilex Nerd Font Mono
# Misc Code Point Fixes
# symbol_map U+21B5,U+25B8,U+2630,U+2632,U+2714,U+279C Symbols Nerd Font Mono

#:  Show underlying characters in ligatures when working with them
disable_ligatures cursor
#: }}}

#: Window stuff {{{
window_padding_width 10
background_opacity 0.97

enabled_layouts splits
#: }}}

#: MacOS Stuff {{{
macos_option_as_alt left
macos_show_window_title_in none
hide_window_decorations titlebar-only
#: }}}

#: Active theme (cendre) {{{
# cendre · hard · https://github.com/Aejkatappaja/cendre
# generated by scripts/extras.lua, do not edit
# then in kitty.conf:  include cendre.conf

background #1d1917
foreground #e6d5c2
cursor #ea9875
cursor_text_color #1d1917
selection_background #36241d
selection_foreground #e6d5c2
url_color #4e89a2
active_border_color #ea9875
inactive_border_color #3d3633
bell_border_color #f4a21c
active_tab_background #1d1917
active_tab_foreground #e6d5c2
inactive_tab_background #141110
inactive_tab_foreground #73665b

# normal
color0 #26211f
color1 #d1766e
color2 #99af6b
color3 #fcba81
color4 #58bdff
color5 #9480ba
color6 #4e89a2
color7 #a09384

# bright
color8 #73665b
color9 #d25780
color10 #43b16a
color11 #f4a21c
color12 #8bcfff
color13 #a692cd
color14 #20c9cb
color15 #e6d5c2

#: }}}

#: Remote control {{{
allow_remote_control yes
#: }}}
